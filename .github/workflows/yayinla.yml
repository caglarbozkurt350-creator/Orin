# Orvane · tek tuşla masaüstü sürüm yayını
# Kullanım: GitHub › Actions › "Orvane sürümünü yayınla" › Run workflow (telefondan da olur).
# package.json'daki sürümü Windows'ta derler, GitHub Releases'e yükler; Orvane açılınca güncellemeyi önerir.
# Önce testler çalışır; biri düşerse yayın yapılmaz.
# Yayından sonra eski sürümler silinir: en yeni 2 sürüm + onayli-surumler.json'daki en yeni onaylı sürüm kalır.
# Sürüm notu: surum-notlari/<sürüm>.md varsa sürüm açıklamasına yazılır.
name: Orvane sürümünü yayınla
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yayinla
  cancel-in-progress: false
jobs:
  yayinla:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Paketleri kur
        run: npm ci
      - name: Testler (biri düşerse yayın yapılmaz)
        timeout-minutes: 10
        run: npm run smoke
      - name: Derle
        run: npx electron-builder --win nsis --publish never
      - name: Yayınla (sürüm varsa dosyaları değiştirilir)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          F="dist/Orvane-Kurulum-$V.exe dist/Orvane-Kurulum-$V.exe.blockmap dist/latest.yml"
          N="surum-notlari/$V.md"; [ -f "$N" ] || { echo "Orvane $V" > /tmp/not.md; N=/tmp/not.md; }
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V zaten var: dosyalar ve not yenileniyor"
            gh release upload "v$V" $F --clobber
            gh release edit "v$V" --title "Orvane $V" --notes-file "$N" --draft=false --latest
          else
            gh release create "v$V" $F --target "${{ github.sha }}" --title "Orvane $V" --notes-file "$N" --latest
          fi
          gh release view "v$V" --json assets --jq '[.assets[].name]|join(", ")'
      - name: Eski sürümleri temizle (son 2 + en yeni onaylı kalır)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R="${{ github.repository }}"
          ONAYLI="v$(node -p "require('./onayli-surumler.json').surumler[0].v")"
          echo "Kalacak onaylı sürüm: $ONAYLI"
          # en yeniden eskiye; taslaklar sayılmaz
          gh api --paginate "repos/$R/releases?per_page=100" --jq '.[] | select(.draft|not) | "\(.id) \(.tag_name)"' > liste.txt
          SAY=0; KALAN=""
          while read -r ID TAG; do
            SAY=$((SAY+1))
            if [ $SAY -le 2 ] || [ "$TAG" = "$ONAYLI" ]; then KALAN="$KALAN $TAG"; continue; fi
            echo "Siliniyor: $TAG"
            gh api -X DELETE "repos/$R/releases/$ID"
          done < liste.txt
          # sürümü kalmayan v* etiketleri (elle silinen sürümlerinkiler dahil)
          gh api --paginate "repos/$R/tags?per_page=100" --jq '.[].name' | grep '^v' | while read -r TAG; do
            case " $KALAN " in *" $TAG "*) ;; *) echo "Etiket siliniyor: $TAG"; gh api -X DELETE "repos/$R/git/refs/tags/$TAG" 2>/dev/null || true ;; esac
          done
          echo "Kalan sürümler:$KALAN"
